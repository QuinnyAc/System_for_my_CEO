<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Ops 公开数据采集助手</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#1f2937;background:#f8fafc}
    .card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
    h1{font-size:24px;margin:0 0 8px}.muted{color:#64748b;font-size:14px;line-height:1.6}
    label{display:block;font-weight:600;margin-top:18px;margin-bottom:6px}.input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:14px}
    .row{display:flex;gap:12px;align-items:center;margin-top:18px}.button{border:0;border-radius:10px;padding:10px 16px;background:#111827;color:white;font-weight:600;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}
    .status{margin-top:16px;padding:10px 12px;border-radius:10px;background:#f1f5f9;font-size:13px;white-space:pre-wrap}.ok{background:#ecfdf5;color:#065f46}.error{background:#fef2f2;color:#991b1b}
    .note{margin-top:18px;padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-size:13px;line-height:1.7}
  </style>
</head>
<body>
  <div class="card">
    <h1>公开数据采集助手</h1>
    <div class="muted">只执行中央网站创建的任务：账号监控、新作品发现、手动链接采集和已登记作品的数据更新。平时手动浏览社交平台不会写入系统。</div>

    <label><input id="enabled" type="checkbox" /> 启用自动采集与账号监控</label>

    <label for="collectorUrl">Collector 地址</label>
    <input id="collectorUrl" class="input" placeholder="https://...-3100.app.github.dev/collector" />

    <label for="token">Collector Token</label>
    <input id="token" class="input" type="password" autocomplete="off" placeholder="从中央 Codespace 的 COLLECTOR_TOKEN 获取" />

    <label for="machineName">电脑名称</label>
    <input id="machineName" class="input" placeholder="例如 1" />

    <div class="note">自动模式：中央网站登记账号主页后，这台电脑会定时在后台检查账号公开页面，发现新作品后自动加入采集队列；作品数据会按时间周期再次读取。也可以继续在“公开数据采集”页面手动粘贴作品链接作为补充。不会自动登录、点赞、评论、关注，也不会绕过验证码或平台权限。</div>

    <div class="row">
      <button id="save" class="button">保存设置</button>
      <button id="test" class="button secondary">测试连接</button>
    </div>
    <div id="status" class="status">尚未读取状态</div>
  </div>
  <script src="options.js"></script>
</body>
</html>
