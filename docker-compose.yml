services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_ops_hub}
      POSTGRES_USER: ${POSTGRES_USER:-media_ops_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - media_ops_hub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media_ops_hub} -d ${POSTGRES_DB:-media_ops_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment: &api_environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-media_ops_hub}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-media_ops_hub}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3100}
      APP_USERNAME: ${APP_USERNAME:-WR}
      APP_PASSWORD: ${APP_PASSWORD:-change-me-now}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-media-ops-session-secret}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:-development-only-media-ops-credentials-secret}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-change-me-collector-token}
      AUTO_SYNC_ENABLED: ${AUTO_SYNC_ENABLED:-false}
      AUTO_SYNC_INTERVAL_MINUTES: ${AUTO_SYNC_INTERVAL_MINUTES:-60}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
    ports:
      - "${API_PORT:-8100}:8100"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload

  collector:
    build:
      context: ./apps/api
    environment: *api_environment
    ports:
      - "${COLLECTOR_PORT:-8200}:8200"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn app.collector_app:app --host 0.0.0.0 --port 8200 --reload
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8100
      COLLECTOR_INTERNAL_URL: http://collector:8200
      COLLECTOR_HOST_URL: http://host.docker.internal:8200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      - api
      - collector
    volumes:
      - ./apps/web:/app
      - media_ops_hub_web_node_modules:/app/node_modules
    command: npm run dev -- --port 3100

volumes:
  media_ops_hub_postgres:
  media_ops_hub_web_node_modules:
