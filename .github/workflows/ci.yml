name: CI

on:
  push:
    branches: [main, "build/**", "stabilize/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: media_ops_hub
          POSTGRES_USER: media_ops_hub
          POSTGRES_PASSWORD: media-ops-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media_ops_hub -d media_ops_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://media_ops_hub:media-ops-ci-password@localhost:5432/media_ops_hub
      CORS_ORIGINS: http://localhost:3100
      COLLECTOR_TOKEN: media-ops-ci-collector-token
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m compileall app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  browser-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check browser-collector/service-worker.js
      - run: node --check browser-collector/content-script.js
      - run: node --check browser-collector/youtube-account-metrics.js
      - run: node --check browser-collector/youtube-main-world.js
      - run: node --check browser-collector/options.js
      - run: node -e "JSON.parse(require('fs').readFileSync('browser-collector/manifest.json','utf8')); console.log('manifest ok')"
      - name: Verify collector manifest version and YouTube main-world registration
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('browser-collector/manifest.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error(`invalid manifest version: ${manifest.version}`);
          const mainWorld = (manifest.content_scripts || []).find((entry) =>
            entry.world === 'MAIN' && Array.isArray(entry.js) && entry.js.includes('youtube-main-world.js')
          );
          if (!mainWorld) throw new Error('youtube-main-world.js is not registered in MAIN world');
          console.log(`collector version ${manifest.version}; YouTube main-world reader registered`);
          NODE
      - name: Package collector ZIP
        run: bash .devcontainer/package-browser-collector.sh
      - run: test -s media-ops-public-collector.zip

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build api collector web
